<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FWI Prediction | FireWatch</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-base: #09090b;
        --bg-surface: #18181b;
        --bg-input: #09090b;
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-focus: var(--accent-primary);
        --text-main: #f4f4f5;
        --text-muted: #a1a1aa;
        --accent-primary: #ea580c;
        --danger-bg: rgba(234, 88, 12, 0.1);
        --radius-md: 8px;
        --radius-lg: 12px;
        --transition: 0.2s ease;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "DM Sans", system-ui, sans-serif;
        background-color: #09090b;
        color: var(--text-main);
        min-height: 100vh;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .container {
        max-width: 768px;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
      }

      /* Header / Nav */
      .header {
        margin-bottom: 3rem;
      }

      .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 2rem;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
        color: var(--text-main);
        text-decoration: none;
      }

      .logo svg {
        color: var(--accent-primary);
      }

      .back-link {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.875rem;
        transition: color var(--transition);
      }

      .back-link:hover {
        color: var(--text-main);
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      /* Results Banner */
      .result-banner {
        background: var(--danger-bg);
        border: 1px solid rgba(234, 88, 12, 0.2);
        border-radius: var(--radius-lg);
        padding: 1.5rem;
        margin-bottom: 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        animation: fadeIn 0.5s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .result-label {
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--accent-primary);
        margin-bottom: 0.25rem;
      }

      .result-value {
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--text-main);
        line-height: 1;
      }

      /* Forms - Senior Dev Best Practices */
      .form-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        padding: 2rem;
      }

      fieldset {
        border: none;
        margin-bottom: 2rem;
        padding: 0;
      }

      fieldset:last-of-type {
        margin-bottom: 0;
      }

      legend {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 1rem;
        width: 100%;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--border-subtle);
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1.25rem;
      }

      .field-group {
        display: flex;
        flex-direction: column;
        gap: 0.375rem;
      }

      label {
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--text-muted);
      }

      label span {
        opacity: 0.6;
      }

      input {
        background: var(--bg-input);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        color: var(--text-main);
        font-family: inherit;
        font-size: 0.9375rem;
        padding: 0.75rem 1rem;
        transition: all var(--transition);
        width: 100%;
        /* Subtle inner shadow for depth */
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
      }

      input::placeholder {
        color: #52525b;
      }

      input:hover {
        border-color: rgba(255, 255, 255, 0.2);
      }

      input:focus-visible {
        outline: none;
        border-color: var(--border-focus);
        box-shadow:
          0 0 0 1px var(--border-focus),
          inset 0 1px 2px rgba(0, 0, 0, 0.2);
      }

      /* Actions */
      .form-actions {
        margin-top: 2rem;
        padding-top: 2rem;
        border-top: 1px solid var(--border-subtle);
        display: flex;
        justify-content: flex-end;
      }

      .submit-btn {
        background: var(--text-main);
        color: #09090b;
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;
        font-family: inherit;
        font-size: 0.9375rem;
        font-weight: 600;
        padding: 0.75rem 2rem;
        transition: all var(--transition);
      }

      .submit-btn:hover {
        background: #fff;
        transform: translateY(-1px);
      }
      .submit-btn:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <header class="header">
        <nav class="navbar">
          <a href="{{ url_for('index') }}" class="logo">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"
              ></path>
            </svg>
            FireWatch
          </a>
          <a href="{{ url_for('index') }}" class="back-link">Return Home</a>
        </nav>
        <h1>Prediction Engine</h1>
      </header>

      {% if results is defined %}
      <div class="result-banner" role="alert" aria-live="polite">
        <div>
          <div class="result-label">Calculated FWI</div>
          <div class="result-value">{{ "%.2f"|format(results) }}</div>
        </div>
      </div>
      {% endif %}

      <div class="form-card">
        <form action="{{ url_for('predict') }}" method="post">
          <fieldset>
            <legend>Meteorological Data</legend>
            <div class="field-grid">
              <div class="field-group">
                <label for="Temperature">Temperature <span>(°C)</span></label>
                <input
                  type="number"
                  step="any"
                  name="Temperature"
                  id="Temperature"
                  required
                  placeholder="25.5"
                />
              </div>
              <div class="field-group">
                <label for="RH">Relative Humidity <span>(%)</span></label>
                <input
                  type="number"
                  step="any"
                  name="RH"
                  id="RH"
                  required
                  placeholder="45"
                />
              </div>
              <div class="field-group">
                <label for="Ws">Wind Speed <span>(km/h)</span></label>
                <input
                  type="number"
                  step="any"
                  name="Ws"
                  id="Ws"
                  required
                  placeholder="6.4"
                />
              </div>
              <div class="field-group">
                <label for="Rain">Rainfall <span>(mm)</span></label>
                <input
                  type="number"
                  step="any"
                  name="Rain"
                  id="Rain"
                  required
                  placeholder="0.0"
                />
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>Fuel Moisture Telemetry</legend>
            <div class="field-grid">
              <div class="field-group">
                <label for="FFMC">FFMC</label>
                <input
                  type="number"
                  step="any"
                  name="FFMC"
                  id="FFMC"
                  required
                  placeholder="86.2"
                />
              </div>
              <div class="field-group">
                <label for="DMC">DMC</label>
                <input
                  type="number"
                  step="any"
                  name="DMC"
                  id="DMC"
                  required
                  placeholder="26.2"
                />
              </div>
              <div class="field-group">
                <label for="ISI">ISI</label>
                <input
                  type="number"
                  step="any"
                  name="ISI"
                  id="ISI"
                  required
                  placeholder="5.1"
                />
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>Location Parameters</legend>
            <div class="field-grid">
              <div class="field-group">
                <label for="Classes">Fire Class Data</label>
                <input
                  type="number"
                  step="any"
                  name="Classes"
                  id="Classes"
                  required
                  placeholder="0"
                />
              </div>
              <div class="field-group">
                <label for="Region">Region Indicator</label>
                <input
                  type="number"
                  step="any"
                  name="Region"
                  id="Region"
                  required
                  placeholder="1"
                />
              </div>
            </div>
          </fieldset>

          <div class="form-actions">
            <button type="submit" class="submit-btn">Run Analysis</button>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
